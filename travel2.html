<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travels | Periza Arora</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #fffaf4;
      font-family: 'Patrick Hand', cursive;
      color: #5a4c4c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 40px;
      font-family: 'Poppins', sans-serif;
      color: #a08f81; 
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      max-width: 1000px;
      width: 100%;
    }

    .gallery a img {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transform: scale(0.5) rotate(-5deg) skewX(-3deg);
      opacity: 0;
      animation: paperOpen 1s ease forwards;
    }

    /* Animation delays for each image */
    .gallery a:nth-child(1) img { animation-delay: 0.2s; }
    .gallery a:nth-child(2) img { animation-delay: 0.4s; }
    .gallery a:nth-child(3) img { animation-delay: 0.6s; }
    .gallery a:nth-child(4) img { animation-delay: 0.8s; }

    @keyframes paperOpen {
      0% {
        transform: scale(0.5) rotate(-5deg) skewX(-3deg);
        opacity: 0;
        filter: blur(2px);
      }
      60% {
        transform: scale(1.05) rotate(2deg) skewX(0);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .gallery a img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .back {
      margin-top: 40px;
      text-decoration: none;
      font-size: 14px;
      background: #ffe0ed;
      padding: 10px 20px;
      border-radius: 20px;
      color: #805a70;
      transition: background 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    .back:hover {
      background: #ffd3e5;
    }
  </style>
</head>
<body>

  <h1>My Travels</h1>

  <div class="gallery">
    <a href="nainital.html"><img src="1.png" alt="Nainital Trip"></a>
    <a href="manali.html"><img src="3.png" alt="Manali Trip"></a>
    <a href="jaipur.html"><img src="2.png" alt="Jaipur Trip"></a>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

</body>
</html>
